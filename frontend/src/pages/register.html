<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - AvitaCare</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
<div class="auth-layout">
  <!-- Brand Panel -->
  <div class="auth-brand-panel">
    <div class="brand-name">AvitaCare</div>
    <div class="brand-tagline">Connecting families with trusted caregivers across Kenya</div>
    <div class="brand-illustration">
      <svg width="160" height="120" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M30 90 C28 85 26 78 27 70 C28 62 32 58 36 58 C38 58 40 59 41 61 L41 40 C41 36 44 33 47 33 C50 33 53 36 53 40 L53 55 C54 53 56 52 59 52 C62 52 65 55 65 58 L65 62 C66 60 68 59 71 59 C74 59 77 62 77 65 L77 75 C78 74 80 73 82 73 C85 73 88 76 88 79 L88 90 C88 100 80 108 70 108 L50 108 C40 108 32 100 30 90 Z"
              stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M130 90 C132 85 134 78 133 70 C132 62 128 58 124 58 C122 58 120 59 119 61 L119 40 C119 36 116 33 113 33 C110 33 107 36 107 40 L107 55 C106 53 104 52 101 52 C98 52 95 55 95 58 L95 62 C94 60 92 59 89 59 C86 59 83 62 83 65 L83 75 C82 74 80 73 78 73 C75 73 72 76 72 79 L72 90 C72 100 80 108 90 108 L110 108 C120 108 128 100 130 90 Z"
              stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M59 108 L101 108" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <h1>Create your account</h1>
      <p class="subtitle">Join AvitaCare today</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="first_name">First Name</label>
          <input class="form-input" type="text" id="first_name" name="first_name" autocomplete="given-name" required />
          <span class="form-error" id="err-first_name"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="last_name">Last Name</label>
          <input class="form-input" type="text" id="last_name" name="last_name" autocomplete="family-name" required />
          <span class="form-error" id="err-last_name"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required />
          <span class="form-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone_number">Phone Number</label>
          <input class="form-input" type="tel" id="phone_number" name="phone_number" autocomplete="tel" />
          <span class="form-error" id="err-phone_number"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">I am</label>
          <select class="form-input" id="role" name="role" required>
            <option value="caregiver">I am a Caregiver</option>
            <option value="family">I am looking for a Caregiver</option>
          </select>
          <span class="form-error" id="err-role"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="password">Show</button>
          </div>
          <span class="form-error" id="err-password"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password_confirm">Confirm Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="password_confirm">Show</button>
          </div>
          <span class="form-error" id="err-password_confirm"></span>
        </div>

        <div class="error-banner" id="error-banner" role="alert"></div>

        <button type="submit" class="btn-primary">Create account</button>
      </form>

      <p class="auth-link">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { register, saveTokens, isLoggedIn } from '../api/auth.js';

  if (isLoggedIn()) {
    window.location.replace('dashboard.html');
  }

  // Pre-select role from ?role= query param
  const urlRole = new URLSearchParams(window.location.search).get('role');
  if (urlRole === 'family' || urlRole === 'caregiver') {
    document.getElementById('role').value = urlRole;
  }

  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    });
  });

  const fieldIds = ['first_name', 'last_name', 'email', 'phone_number', 'role', 'password', 'password_confirm'];

  function clearErrors() {
    fieldIds.forEach(id => {
      const el = document.getElementById(`err-${id}`);
      if (el) el.textContent = '';
    });
    document.getElementById('error-banner').textContent = '';
  }

  function showFieldErrors(errors) {
    Object.entries(errors).forEach(([field, messages]) => {
      const el = document.getElementById(`err-${field}`);
      if (el) {
        el.textContent = Array.isArray(messages) ? messages[0] : messages;
      } else {
        document.getElementById('error-banner').textContent = Array.isArray(messages) ? messages[0] : messages;
      }
    });
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const payload = {
      first_name: document.getElementById('first_name').value.trim(),
      last_name: document.getElementById('last_name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone_number: document.getElementById('phone_number').value.trim(),
      role: document.getElementById('role').value,
      password: document.getElementById('password').value,
      password_confirm: document.getElementById('password_confirm').value,
    };

    try {
      const data = await register(payload);
      saveTokens(data.tokens.access, data.tokens.refresh);
      localStorage.setItem('user_first_name', data.user.first_name);
      window.location.replace('dashboard.html');
    } catch (err) {
      if (err.data && typeof err.data === 'object') {
        showFieldErrors(err.data);
      } else {
        document.getElementById('error-banner').textContent = err.message || 'Registration failed.';
      }
    }
  });
</script>
</body>
</html>
