<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Service Request - AvitaCare</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <nav class="app-nav">
    <a class="app-nav-brand" href="dashboard.html">AvitaCare</a>
    <div class="app-nav-right">
      <span class="app-nav-username" id="nav-username"></span>
      <button class="btn-ghost" id="signout-btn" type="button">Sign out</button>
    </div>
  </nav>

  <main class="app-main app-main-narrow">
    <a class="back-link" href="dashboard.html">Back to Dashboard</a>

    <h1 class="page-heading">New Service Request</h1>
    <p class="page-subheading">Fill in the details below and we will match you with a suitable caregiver.</p>

    <p class="success-message" id="success-message" hidden>
      Your request has been submitted. We will notify you when a caregiver is matched.
    </p>

    <form id="request-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="care_type">Care Type</label>
        <select class="form-input" id="care_type" name="care_type" required>
          <option value="elderly_care">Elderly Care</option>
          <option value="childcare">Childcare</option>
          <option value="post_surgical">Post-Surgical Care</option>
          <option value="disability_support">Disability Support</option>
        </select>
        <span class="form-error" id="err-care_type"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="care_recipient_name">Care Recipient Name</label>
        <input class="form-input" type="text" id="care_recipient_name" name="care_recipient_name" required />
        <span class="form-error" id="err-care_recipient_name"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="care_recipient_age">Care Recipient Age</label>
        <input class="form-input" type="number" id="care_recipient_age" name="care_recipient_age" min="0" required />
        <span class="form-error" id="err-care_recipient_age"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="location">Location</label>
        <input class="form-input" type="text" id="location" name="location" placeholder="e.g. Westlands, Nairobi" required />
        <span class="form-error" id="err-location"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="start_date">Start Date</label>
        <input class="form-input" type="date" id="start_date" name="start_date" required />
        <span class="form-error" id="err-start_date"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="end_date">End Date</label>
        <input class="form-input" type="date" id="end_date" name="end_date" required />
        <span class="form-error" id="err-end_date"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="additional_notes">Additional Notes</label>
        <textarea class="form-input" id="additional_notes" name="additional_notes" rows="4"></textarea>
        <span class="form-error" id="err-additional_notes"></span>
      </div>

      <div class="error-banner" id="error-banner" role="alert"></div>

      <button type="submit" class="btn-primary form-submit">Submit Request</button>
    </form>
  </main>

  <script type="module" src="service-request.js"></script>
</body>
</html>
