<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <title>Dashboard, Avitacare</title>
  <link rel="stylesheet" href="/static/css/components/typography.css" />
  <link rel="stylesheet" href="/static/css/components/buttons.css" />
  <link rel="stylesheet" href="/static/css/components/navbar.css" />
  <link rel="stylesheet" href="/static/css/components/sidebar.css" />
  <link rel="stylesheet" href="/static/css/components/sections.css" />
  <link rel="stylesheet" href="/static/css/components/banner.css" />
  <link rel="stylesheet" href="/static/css/components/stats.css" />
  <link rel="stylesheet" href="/static/css/components/table.css" />
  <link rel="stylesheet" href="/static/css/components/loading.css" />
  <link rel="stylesheet" href="/static/css/components/empty-state.css" />
  <link rel="stylesheet" href="/static/css/pages/admin-dashboard.css" />
</head>
<body data-page="/admin/">

<script src="/static/js/icons.js"></script>
<script src="/static/js/app.js"></script>
<script>
  mountAppShell('Dashboard');

  function fromKey(key) {
    return (key || '').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
  }

  const URGENCY_CLASS = { high: 'status-danger', medium: 'status-warning', low: 'status-muted' };
  function urgencyLabel(level) {
    const cls = URGENCY_CLASS[level] || 'status-muted';
    return `<span class="status ${cls}"><span data-icon="alert-triangle" data-size="14"></span>${fromKey(level)}</span>`;
  }

  async function loadDashboard() {
    const content = document.getElementById('page-content');
    renderInto(content, loadingState());

    const [report, pending, queueData] = await Promise.all([
      apiFetch('/admin-portal/reports/'),
      apiFetch('/admin-portal/pending-verifications/'),
      apiFetch('/matching/queue/'),
    ]);
    const queue = queueData.queue || [];

    const userName = (getUser() || {}).first_name || 'Admin';
    renderInto(content, `
      <div class="banner">
        <div>
          <div class="banner-title">Welcome back, ${userName}</div>
          <div class="banner-sub">${report.caregivers.pending_verification} caregiver profile(s) awaiting review.</div>
        </div>
        <div class="banner-actions">
          <a href="/admin/verifications" class="btn btn-primary"><span data-icon="shield" data-size="15"></span>Review now</a>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-label"><span data-icon="users" data-size="14"></span>Total users</div>
          <div class="stat-value">${report.users.total}</div>
        </div>
        <div class="stat">
          <div class="stat-label"><span data-icon="shield" data-size="14"></span>Pending verifications</div>
          <div class="stat-value">${report.caregivers.pending_verification}</div>
        </div>
        <div class="stat">
          <div class="stat-label"><span data-icon="calendar" data-size="14"></span>Active bookings</div>
          <div class="stat-value">${report.bookings.confirmed + report.bookings.ongoing}</div>
        </div>
        <div class="stat">
          <div class="stat-label"><span data-icon="star" data-size="14"></span>Average rating</div>
          <div class="stat-value">${parseFloat(report.reviews.average_rating || 0).toFixed(1)}</div>
        </div>
      </div>

      <div class="section-header">
        <h2>Request queue, by urgency</h2>
      </div>
      <div class="section" id="queue-section"></div>

      <div class="section-header">
        <h2>Pending verifications</h2>
        <a href="/admin/verifications" class="btn btn-sm">View all</a>
      </div>
      <div class="section" id="pending-section"></div>
    `);

    renderTable('queue-section', {
      columns: [
        { header: 'Family', render: (r) => r.family_name },
        { header: 'Care type', render: (r) => fromKey(r.care_type) },
        { header: 'Urgency', render: (r) => urgencyLabel(r.urgency_level) },
        { header: 'Location', render: (r) => (r.location ? r.location.display_name : 'Not set') },
        { header: 'Submitted', render: (r) => new Date(r.created_at).toLocaleString() },
      ],
      rows: queue.slice(0, 8),
      emptyTitle: 'No open requests',
      emptySub: 'Open service requests will appear here, urgent first.',
      emptyIcon: 'clipboard',
    });

    renderTable('pending-section', {
      columns: [
        { header: 'Name', render: (c) => c.full_name },
        { header: 'Location', render: (c) => (c.location ? c.location.display_name : '') },
        { header: 'Experience', render: (c) => `${c.years_experience} yrs` },
        { header: 'Skills', render: (c) => (c.skills || []).map(fromKey).join(', ') || 'None listed' },
      ],
      rows: pending.slice(0, 5),
      emptyTitle: 'No pending verifications',
      emptySub: 'New caregiver profiles will appear here for review.',
      emptyIcon: 'shield',
    });
  }

  loadDashboard();
</script>
</body>
</html>
