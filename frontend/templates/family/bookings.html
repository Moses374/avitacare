<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/avitacareicon.png" type="image/png" />
  <title>Bookings, Avitacare</title>
  <link rel="stylesheet" href="/static/css/components/typography.css" />
  <link rel="stylesheet" href="/static/css/components/buttons.css" />
  <link rel="stylesheet" href="/static/css/components/forms.css" />
  <link rel="stylesheet" href="/static/css/components/navbar.css" />
  <link rel="stylesheet" href="/static/css/components/sidebar.css" />
  <link rel="stylesheet" href="/static/css/components/sections.css" />
  <link rel="stylesheet" href="/static/css/components/table.css" />
  <link rel="stylesheet" href="/static/css/components/status.css" />
  <link rel="stylesheet" href="/static/css/components/modal.css" />
  <link rel="stylesheet" href="/static/css/components/toast.css" />
  <link rel="stylesheet" href="/static/css/components/loading.css" />
  <link rel="stylesheet" href="/static/css/components/empty-state.css" />
  <link rel="stylesheet" href="/static/css/components/whatsapp.css" />
  <link rel="stylesheet" href="/static/css/pages/family-bookings.css" />
</head>
<body data-page="/family/bookings.html">

<script src="/static/js/icons.js"></script>
<script src="/static/js/vendor/zod.umd.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/validation.js"></script>
<script>
  mountAppShell('Bookings');

  function cancelBooking(id) {
    confirmDialog({
      title: 'Cancel booking',
      message: 'Cancel this booking? The caregiver will be notified and your service request will reopen so you can choose another caregiver.',
      confirmLabel: 'Cancel booking',
      danger: true,
      onConfirm: async () => {
        try {
          await apiFetch(`/bookings/${id}/status/`, { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
          toast('Booking cancelled.', 'success');
          loadBookings();
        } catch (err) {
          toast(formatApiError(err), 'error');
        }
      },
    });
  }

  function reviewModal(booking) {
    openModal(`
      <div class="modal-header"><h2>Leave a review</h2>
        <button class="icon-btn" data-action="close"><span data-icon="x" data-size="16"></span></button>
      </div>
      <div class="modal-body">
        <div id="review-error" class="error-banner"></div>
        <form id="review-form">
          <div class="form-group">
            <label for="rating">Rating, 1 to 5</label>
            <select id="rating">
              <option value="5">5, Excellent</option>
              <option value="4">4, Good</option>
              <option value="3">3, Average</option>
              <option value="2">2, Below average</option>
              <option value="1">1, Poor</option>
            </select>
          </div>
          <div class="form-group">
            <label for="comment">Comment</label>
            <textarea id="comment" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn" data-action="close">Cancel</button>
        <button class="btn btn-primary" id="submit-review-btn">Submit review</button>
      </div>
    `);
    document.querySelectorAll('[data-action="close"]').forEach((btn) => btn.addEventListener('click', closeModal));
    document.getElementById('submit-review-btn').addEventListener('click', async () => {
      hideError('review-error');
      const check = validate(ReviewSchema, {
        booking: booking.id,
        rating: Number(document.getElementById('rating').value),
        comment: document.getElementById('comment').value,
      });
      if (!applyValidation(check, { banner: 'review-error' })) return;
      try {
        await apiFetch('/reviews/', {
          method: 'POST',
          body: JSON.stringify(check.data),
        });
        closeModal();
        toast('Review submitted.', 'success');
        loadBookings();
      } catch (err) {
        showError('review-error', formatApiError(err));
      }
    });
  }

  async function loadBookings() {
    const bookings = await apiFetch('/bookings/');
    window.__bookings = bookings;
    renderTable('bookings-table', {
      columns: [
        { header: 'Caregiver', render: (b) => b.caregiver_name },
        { header: 'Start', render: (b) => new Date(b.scheduled_start).toLocaleString() },
        { header: 'End', render: (b) => new Date(b.scheduled_end).toLocaleString() },
        { header: 'Status', render: (b) => statusLabel(b.status) },
        { header: '', render: (b) => {
            const buttons = [waButton(b, 'family')];
            if (b.status === 'completed') buttons.push(`<button class="btn btn-sm" data-review="${b.id}">Leave review</button>`);
            if (b.status === 'pending' || b.status === 'confirmed') buttons.push(`<button class="btn btn-sm" data-cancel="${b.id}">Cancel</button>`);
            return buttons.filter(Boolean).join(' ');
          } },
      ],
      rows: bookings,
      emptyTitle: 'No bookings yet',
      emptySub: 'Bookings appear here once you confirm a caregiver match.',
      emptyIcon: 'calendar',
    });
    document.querySelectorAll('[data-review]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = Number(btn.getAttribute('data-review'));
        reviewModal(window.__bookings.find((b) => b.id === id));
      });
    });
    document.querySelectorAll('[data-cancel]').forEach((btn) => {
      btn.addEventListener('click', () => cancelBooking(Number(btn.getAttribute('data-cancel'))));
    });
    wireWhatsAppButtons(bookings, 'family');
  }

  renderInto('page-content', `
    <div class="section-header"><h1>Bookings</h1></div>
    <div class="section" id="bookings-table">${loadingState()}</div>
  `);
  loadBookings();
</script>
</body>
</html>
