<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/avitacareicon.png" type="image/png" />
  <title>Profile, Avitacare</title>
  <link rel="stylesheet" href="/static/css/components/typography.css" />
  <link rel="stylesheet" href="/static/css/components/buttons.css" />
  <link rel="stylesheet" href="/static/css/components/forms.css" />
  <link rel="stylesheet" href="/static/css/components/navbar.css" />
  <link rel="stylesheet" href="/static/css/components/sidebar.css" />
  <link rel="stylesheet" href="/static/css/components/sections.css" />
  <link rel="stylesheet" href="/static/css/components/loading.css" />
  <link rel="stylesheet" href="/static/css/components/toast.css" />
  <link rel="stylesheet" href="/static/css/components/location-select.css" />
  <link rel="stylesheet" href="/static/css/pages/family-profile.css" />
</head>
<body data-page="/family/profile.html">

<script src="/static/js/icons.js"></script>
<script src="/static/js/vendor/zod.umd.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/validation.js"></script>
<script src="/static/js/location-select.js"></script>
<script>
  mountAppShell('Profile');

  async function loadProfile() {
    const profile = await apiFetch('/families/profile/');
    renderInto('page-content', `
      <div class="section-header"><h1>Profile</h1></div>
      <div class="section">
        <div class="section-title">Household details</div>
        <div class="section-body padded">
          <div id="profile-error" class="error-banner"></div>
          <form id="profile-form" class="profile-form" novalidate>
            ${locationSelectMarkup({ id: 'profile-location', label: 'Location', value: profile.location })}
            <p class="field-hint">Your general area helps us surface caregivers near you when you browse or submit a request.</p>

            <div class="form-group">
              <label for="preferred_caregiver_type">Preferred caregiver type</label>
              <select id="preferred_caregiver_type">
                <option value="">No preference</option>
                <option value="elderly" ${profile.preferred_caregiver_type === 'elderly' ? 'selected' : ''}>Elderly care</option>
                <option value="child" ${profile.preferred_caregiver_type === 'child' ? 'selected' : ''}>Child care</option>
                <option value="disability" ${profile.preferred_caregiver_type === 'disability' ? 'selected' : ''}>Disability support</option>
                <option value="post_hospital" ${profile.preferred_caregiver_type === 'post_hospital' ? 'selected' : ''}>Post hospital recovery</option>
                <option value="palliative" ${profile.preferred_caregiver_type === 'palliative' ? 'selected' : ''}>Palliative care</option>
              </select>
              <p class="field-hint">The kind of care your household most often needs. This guides our matching suggestions, though you can still request any type at any time.</p>
            </div>

            <div class="form-group">
              <label for="care_recipient_name">Care recipient name</label>
              <input type="text" id="care_recipient_name" placeholder="e.g. Jane Doe" value="${profile.care_recipient_name || ''}" />
              <p class="field-hint">The person who will be receiving care (a family member, elder, or child). This helps caregivers personalise their approach.</p>
            </div>

            <div class="form-group">
              <label for="care_recipient_details">Care recipient details</label>
              <textarea id="care_recipient_details" rows="4" placeholder="e.g. 78-year-old with limited mobility, requires daily medication reminders and light physiotherapy exercises.">${profile.care_recipient_details || ''}</textarea>
              <p class="field-hint">Any relevant health conditions, routines, or special needs the caregiver should know about before arriving.</p>
            </div>

            <button type="submit" class="btn btn-primary">Save changes</button>
          </form>
        </div>
      </div>
    `);

    const locationSelect = initLocationSelect('profile-location', { value: profile.location });
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('profile-error');
      const location = locationSelect.getValue();
      const check = validate(FamilyProfileSchema, {
        location_id: location ? location.location_id : null,
        preferred_caregiver_type: document.getElementById('preferred_caregiver_type').value,
        care_recipient_name: document.getElementById('care_recipient_name').value,
        care_recipient_details: document.getElementById('care_recipient_details').value,
      });
      if (!applyValidation(check, { banner: 'profile-error', fields: { location_id: 'profile-location-input' } })) return;
      try {
        await apiFetch('/families/profile/', {
          method: 'PUT',
          body: JSON.stringify(check.data),
        });
        toast('Profile updated.', 'success');
      } catch (err) {
        showError('profile-error', formatApiError(err));
      }
    });
  }

  renderInto('page-content', loadingState());
  loadProfile();
</script>
</body>
</html>
