<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Avitacare</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
<div class="container" style="max-width:480px; margin-top:3rem;">
  <div class="card">
    <h2 class="text-center">Create an account</h2>

    <p id="error-msg" class="text-center mt-2" style="color:red; display:none;"></p>

    <form id="register-form" class="mt-2">
      <div class="grid-2">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="first_name" required />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="last_name" required />
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="+254..." />
      </div>
      <div class="form-group">
        <label>I am a…</label>
        <select id="role" required>
          <option value="">Select role</option>
          <option value="caregiver">Caregiver</option>
          <option value="family">Family</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
    </form>

    <p class="text-center mt-2 text-muted">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await register({
        first_name: document.getElementById('first_name').value,
        last_name:  document.getElementById('last_name').value,
        email:      document.getElementById('email').value,
        phone:      document.getElementById('phone').value,
        role:       document.getElementById('role').value,
        password:   document.getElementById('password').value,
      });
    } catch (err) {
      const msg = JSON.stringify(err);
      showError('error-msg', msg);
    }
  });
</script>
</body>
</html>
