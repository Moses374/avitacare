<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/avitacareicon.png" type="image/png" />
  <title>Sign in, Avitacare</title>
  <link rel="stylesheet" href="/static/css/components/typography.css" />
  <link rel="stylesheet" href="/static/css/components/buttons.css" />
  <link rel="stylesheet" href="/static/css/components/forms.css" />
  <link rel="stylesheet" href="/static/css/components/navbar.css" />
  <link rel="stylesheet" href="/static/css/components/auth-shell.css" />
  <link rel="stylesheet" href="/static/css/pages/login.css" />
</head>
<body>

<div class="auth-shell">
  <aside class="auth-aside">
    <a class="auth-brand" href="/"><img src="/static/avitacareicon.png" alt="" height="34" /><span>Avitacare</span></a>
    <div class="auth-pitch">
      <h2>Find trusted caregivers with confidence.</h2>
      <div class="auth-points">
        <div class="auth-point"><span data-icon="check-circle" data-size="16"></span>Verified, background checked caregivers</div>
        <div class="auth-point"><span data-icon="check-circle" data-size="16"></span>Secure bookings and messaging</div>
        <div class="auth-point"><span data-icon="check-circle" data-size="16"></span>Transparent reviews from real families</div>
      </div>
    </div>
    <div class="auth-foot">Avitacare, caregiver coordination made simple.</div>
  </aside>

  <main class="auth-main">
    <div class="login-wrap">
      <h1>Sign in</h1>
      <p class="login-sub">Sign in to your Avitacare account.</p>

      <div id="error-msg" class="error-banner"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary login-submit">Sign in</button>
      </form>

      <p class="login-footer-note">Don't have an account, <a href="/register.html">register here</a>.</p>
    </div>
  </main>
</div>

<script src="/static/js/icons.js"></script>
<script src="/static/js/vendor/zod.umd.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/validation.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError('error-msg');
    const check = validate(LoginSchema, {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    if (!applyValidation(check, { banner: 'error-msg' })) return;
    try {
      await login(check.data.email, check.data.password);
    } catch (err) {
      showError('error-msg', err && err.detail ? err.detail : 'Invalid email or password.');
    }
  });
</script>
</body>
</html>
