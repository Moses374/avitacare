<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Avitacare</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
<div class="container" style="max-width:420px; margin-top:4rem;">
  <div class="card">
    <h2 class="text-center">Welcome back</h2>
    <p class="text-muted text-center mt-1">Sign in to your Avitacare account</p>

    <p id="error-msg" class="text-center mt-2" style="color:red; display:none;"></p>

    <form id="login-form" class="mt-2">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
    </form>

    <p class="text-center mt-2 text-muted">
      Don't have an account? <a href="/register.html">Register</a>
    </p>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await login(
        document.getElementById('email').value,
        document.getElementById('password').value
      );
    } catch (err) {
      showError('error-msg', 'Invalid email or password.');
    }
  });
</script>
</body>
</html>
