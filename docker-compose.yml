services:
  db:
    image: postgres:16
    container_name: avitacare-db
    environment:
      POSTGRES_DB: caregiver_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - avitacare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caregiver_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  search:
    image: getmeili/meilisearch:v1.10
    container_name: avitacare-search
    environment:
      MEILI_MASTER_KEY: avitacare-dev-master-key-change-in-production
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - avitacare-search-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    container_name: avitacare-web
    # Migrate, then load the demo dataset (idempotent — skips existing rows),
    # then serve. seed_demo also imports locations and indexes Meilisearch.
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY: your-secret-key-here
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DB_NAME: caregiver_db
      DB_USER: postgres
      DB_PASSWORD: yourpassword
      DB_HOST: db
      DB_PORT: "5432"
      MEILI_HOST: http://search:7700
      MEILI_MASTER_KEY: avitacare-dev-master-key-change-in-production
    # Host 8001 -> container 8000 (host 8000 was already in use by another app).
    ports:
      - "8001:8000"
    # Live-reload backend code edits without rebuilding the image.
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy

volumes:
  avitacare-db-data:
  avitacare-search-data:
